services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_marketing_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_marketing_studio?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_API_BASE_URL is inlined into the client bundle at build
      # time by Next.js, so it must be passed as a build arg, not a runtime
      # `environment:` value (which the already-built JS would never read).
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:4000/api
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
